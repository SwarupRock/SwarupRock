name: Generate Cyberpunk Spaceship Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate-spaceship:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Spaceship Contribution Matrix Generator
        run: |
          python scripts/generate_spaceship_svg.py

      - name: Commit and Push Updated Spaceship SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/spaceship.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: refresh cyberpunk spaceship contribution graph" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
