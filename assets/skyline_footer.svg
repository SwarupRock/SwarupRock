<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <linearGradient id="sky-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020207"/>
      <stop offset="50%" stop-color="#0B0916"/>
      <stop offset="100%" stop-color="#14061A"/>
    </linearGradient>

    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEE09" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF0055" stop-opacity="0"/>
    </linearGradient>

    <filter id="yellow-glow-foot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyan-glow-foot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes fly-av-1 {
        0% { transform: translate(-50px, 40px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(900px, 20px); opacity: 0; }
      }

      @keyframes fly-av-2 {
        0% { transform: translate(900px, 70px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(-50px, 90px); opacity: 0; }
      }

      @keyframes neon-blink {
        0%, 100% { opacity: 1; }
        25% { opacity: 0.4; }
        50% { opacity: 1; }
        75% { opacity: 0.2; }
      }

      @keyframes pulse-skyline {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }

      .footer-text {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        font-size: 26px;
        fill: #FCEE09;
        letter-spacing: 4px;
        animation: neon-blink 3s infinite;
      }

      .av-vehicle-1 {
        animation: fly-av-1 8s linear infinite;
      }

      .av-vehicle-2 {
        animation: fly-av-2 11s linear infinite 4s;
      }
    </style>
  </defs>

  <!-- Sky Canvas Background -->
  <rect width="850" height="240" fill="url(#sky-bg)" rx="4"/>

  <!-- Cyberpunk Night City Grid Lines -->
  <g opacity="0.15">
    <line x1="0" y1="200" x2="850" y2="200" stroke="#FCEE09" stroke-width="1"/>
    <line x1="0" y1="210" x2="850" y2="210" stroke="#FCEE09" stroke-width="1"/>
    <line x1="0" y1="220" x2="850" y2="220" stroke="#FF0055" stroke-width="1"/>
    <line x1="0" y1="230" x2="850" y2="230" stroke="#00F2FE" stroke-width="1"/>
  </g>

  <!-- Night City Skyline Silhouette Shapes -->
  <g fill="#070712" stroke="#FCEE09" stroke-width="0.8" opacity="0.95" class="pulse-skyline">
    <!-- Megabuilding 1 (Arasaka Tower Left) -->
    <path d="M 20 200 L 20 80 L 40 70 L 60 70 L 80 80 L 80 200 Z"/>
    <line x1="50" y1="70" x2="50" y2="30" stroke="#FF0055" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="50" cy="28" r="3" fill="#FF0055" filter="url(#yellow-glow-foot)"/>

    <!-- Building 2 -->
    <path d="M 90 200 L 90 110 L 130 110 L 130 200 Z"/>
    <rect x="98" y="120" width="8" height="6" fill="#FCEE09" opacity="0.8"/>
    <rect x="112" y="135" width="8" height="6" fill="#00F2FE" opacity="0.8"/>
    <rect x="98" y="150" width="8" height="6" fill="#FCEE09" opacity="0.8"/>

    <!-- Megabuilding 3 (Center Spire) -->
    <path d="M 145 200 L 145 50 L 175 30 L 205 50 L 205 200 Z"/>
    <text x="175" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="900" fill="#FCEE09" letter-spacing="1">ARASAKA</text>

    <!-- Building 4 -->
    <path d="M 220 200 L 220 95 L 270 95 L 270 200 Z"/>
    <rect x="230" y="105" width="30" height="4" fill="#FF0055"/>

    <!-- Center Bridge & Cyber Structures -->
    <path d="M 285 200 L 285 130 L 340 130 L 340 200 Z"/>
    <path d="M 350 200 L 350 60 L 410 60 L 410 200 Z"/>
    <!-- Holographic Sign on Center Tower -->
    <rect x="360" y="75" width="40" height="20" fill="#FF0055" opacity="0.8" filter="url(#yellow-glow-foot)"/>
    <text x="380" y="89" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#FFFFFF">NC</text>

    <!-- Right Side Megabuildings -->
    <path d="M 425 200 L 425 100 L 480 100 L 480 200 Z"/>
    <path d="M 495 200 L 495 40 L 525 20 L 555 40 L 555 200 Z"/>
    <circle cx="525" cy="18" r="3" fill="#00F2FE" filter="url(#cyan-glow-foot)"/>

    <path d="M 570 200 L 570 85 L 630 85 L 630 200 Z"/>
    <path d="M 645 200 L 645 120 L 710 120 L 710 200 Z"/>
    <path d="M 725 200 L 725 65 L 765 50 L 805 65 L 805 200 Z"/>
  </g>

  <!-- Flying AV 1 (Aerodyne Spacecraft Left-to-Right) -->
  <g class="av-vehicle-1">
    <!-- Thruster Trail -->
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#FF0055" stroke-width="3" filter="url(#yellow-glow-foot)"/>
    <line x1="-20" y1="0" x2="0" y2="0" stroke="#FCEE09" stroke-width="1.5"/>
    <!-- Vehicle Body -->
    <polygon points="0,-4 16,-2 22,0 16,2 0,4 -4,2 -4,-2" fill="#FCEE09" stroke="#FF0055" stroke-width="1" filter="url(#yellow-glow-foot)"/>
    <circle cx="12" cy="0" r="2" fill="#00F2FE"/>
  </g>

  <!-- Flying AV 2 (Aerodyne Right-to-Left) -->
  <g class="av-vehicle-2">
    <!-- Thruster Trail -->
    <line x1="30" y1="0" x2="0" y2="0" stroke="#00F2FE" stroke-width="3" filter="url(#cyan-glow-foot)"/>
    <polygon points="0,-4 -16,-2 -22,0 -16,2 0,4 4,2 4,-2" fill="#00F2FE" stroke="#FCEE09" stroke-width="1"/>
    <circle cx="-12" cy="0" r="2" fill="#FF0055"/>
  </g>

  <!-- Ground Cyber Grid Gradient Floor -->
  <rect x="0" y="195" width="850" height="45" fill="url(#grid-fade)"/>

  <!-- Footer Banner Text Overlay -->
  <g transform="translate(425, 175)">
    <text x="0" y="0" text-anchor="middle" class="footer-text" filter="url(#yellow-glow-foot)">"SEE YOU IN NIGHT CITY."</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#00F2FE" letter-spacing="2">SWARUP D // NETRUNNER DISPATCH OUT</text>
  </g>

  <!-- Frame Accents -->
  <path d="M 20 225 L 120 225" stroke="#FCEE09" stroke-width="2"/>
  <path d="M 730 225 L 830 225" stroke="#FCEE09" stroke-width="2"/>
</svg>
