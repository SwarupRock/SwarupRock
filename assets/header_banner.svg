<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050A"/>
      <stop offset="50%" stop-color="#090912"/>
      <stop offset="100%" stop-color="#020205"/>
    </linearGradient>

    <linearGradient id="yellow-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCEE09" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFFA75" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FCEE09" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="red-alert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055"/>
      <stop offset="100%" stop-color="#FF2A6D"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanline" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#FCEE09" stroke-width="0.3" stroke-opacity="0.15"/>
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="hud-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FCEE09" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>

    <!-- Drop Shadows / Glow Filters -->
    <filter id="neon-glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-1px, -1px); }
        60% { transform: translate(2px, 1px); }
        80% { transform: translate(1px, -2px); }
        100% { transform: translate(0); }
      }

      @keyframes scan-laser {
        0% { transform: translateY(0); opacity: 0.8; }
        50% { opacity: 0.3; }
        100% { transform: translateY(240px); opacity: 0.8; }
      }

      @keyframes pulse-yellow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      @keyframes pulse-red {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      @keyframes text-flicker {
        0%, 100% { opacity: 1; }
        3% { opacity: 0.4; }
        6% { opacity: 1; }
        7% { opacity: 0.2; }
        8% { opacity: 1; }
        90% { opacity: 1; }
        92% { opacity: 0.5; }
        94% { opacity: 1; }
      }

      .glitch-title {
        font-family: 'Courier New', Courier, monospace, 'Fira Code';
        font-weight: 900;
        font-size: 34px;
        fill: #FCEE09;
        letter-spacing: 3px;
        animation: text-flicker 4s infinite, glitch 3s infinite;
      }

      .sub-title {
        font-family: 'Courier New', Courier, monospace;
        font-weight: 700;
        font-size: 13px;
        fill: #00F2FE;
        letter-spacing: 2px;
      }

      .status-text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        fill: #FCEE09;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .status-value {
        fill: #FFFFFF;
        font-weight: 700;
      }

      .alert-val {
        fill: #FF0055;
        font-weight: bold;
        animation: pulse-red 1.5s infinite;
      }

      .scanning-bar {
        animation: scan-laser 4s linear infinite;
      }

      .blink-dot {
        animation: pulse-yellow 1.2s infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="850" height="250" fill="url(#bg-gradient)" rx="4"/>
  <rect width="850" height="250" fill="url(#hud-grid)"/>
  <rect width="850" height="250" fill="url(#scanline)"/>

  <!-- Outer Cyberpunk Frame -->
  <!-- Top Left Corner Bracket -->
  <path d="M 15 45 L 15 15 L 65 15" fill="none" stroke="#FCEE09" stroke-width="3" filter="url(#neon-glow-yellow)"/>
  <path d="M 20 20 L 40 20" fill="none" stroke="#FF0055" stroke-width="2"/>

  <!-- Top Right Corner Bracket -->
  <path d="M 785 15 L 835 15 L 835 45" fill="none" stroke="#FCEE09" stroke-width="3" filter="url(#neon-glow-yellow)"/>
  <path d="M 810 20 L 830 20" fill="none" stroke="#FF0055" stroke-width="2"/>

  <!-- Bottom Left Corner Bracket -->
  <path d="M 15 205 L 15 235 L 65 235" fill="none" stroke="#FCEE09" stroke-width="3" filter="url(#neon-glow-yellow)"/>

  <!-- Bottom Right Corner Bracket -->
  <path d="M 785 235 L 835 235 L 835 205" fill="none" stroke="#FCEE09" stroke-width="3" filter="url(#neon-glow-yellow)"/>

  <!-- Horizontal Tech Divider Lines -->
  <line x1="65" y1="15" x2="785" y2="15" stroke="#FCEE09" stroke-width="1" stroke-dasharray="8 4" stroke-opacity="0.5"/>
  <line x1="65" y1="235" x2="785" y2="235" stroke="#FCEE09" stroke-width="1" stroke-dasharray="8 4" stroke-opacity="0.5"/>

  <!-- Top Status Badge Header Bar -->
  <rect x="30" y="25" width="220" height="18" fill="#FCEE09" opacity="0.9"/>
  <text x="38" y="38" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#05050A" letter-spacing="1">ARASAKA // NETRUNNER OS v2.077</text>

  <!-- Security Classification Pill -->
  <rect x="680" y="25" width="140" height="18" fill="#FF0055" opacity="0.9" filter="url(#neon-glow-red)"/>
  <text x="690" y="38" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#FFFFFF" letter-spacing="1">CLEARANCE: LEVEL 5</text>

  <!-- Hero Name Title -->
  <g transform="translate(35, 80)">
    <!-- Shadow Glitch Text -->
    <text x="2" y="2" class="glitch-title" fill="#FF0055" opacity="0.7">SWARUP D // NETRUNNER</text>
    <text x="-2" y="-1" class="glitch-title" fill="#00F2FE" opacity="0.7">SWARUP D // NETRUNNER</text>
    <!-- Main Glowing Title -->
    <text x="0" y="0" class="glitch-title" filter="url(#neon-glow-yellow)">SWARUP D // NETRUNNER</text>
  </g>

  <!-- Subtitle -->
  <text x="38" y="106" class="sub-title">AI ENGINEER • COMPUTER VISION • MACHINE LEARNING</text>

  <!-- Cyberpunk Divider Line -->
  <path d="M 35 118 L 520 118 L 535 130 L 815 130" fill="none" stroke="#FCEE09" stroke-width="1.5" filter="url(#neon-glow-yellow)"/>

  <!-- Status Info Box Grid -->
  <g transform="translate(35, 138)" class="status-text">
    <!-- Row 1 -->
    <circle cx="5" cy="8" r="4" fill="#FCEE09" class="blink-dot"/>
    <text x="16" y="12">&gt; SYSTEM STATUS: <tspan class="status-value">ONLINE</tspan></text>

    <circle cx="210" cy="8" r="4" fill="#00F2FE"/>
    <text x="221" y="12">&gt; NEURAL LINK: <tspan class="status-value">ESTABLISHED (10 Gbps)</tspan></text>

    <!-- Row 2 -->
    <circle cx="5" cy="32" r="4" fill="#FCEE09" class="blink-dot"/>
    <text x="16" y="36">&gt; CYBERWARE: <tspan class="status-value">ACTIVE (Kereshnikov ML v4.2)</tspan></text>

    <circle cx="210" cy="32" r="4" fill="#FF0055"/>
    <text x="221" y="36">&gt; LOCATION: <tspan class="status-value">NIGHT CITY // PACIFICA</tspan></text>

    <!-- Row 3 -->
    <circle cx="5" cy="56" r="4" fill="#00F2FE"/>
    <text x="16" y="60">&gt; THREAT LEVEL: <tspan class="alert-val">LOW (MONITORED)</tspan></text>

    <circle cx="210" cy="56" r="4" fill="#FCEE09" class="blink-dot"/>
    <text x="221" y="60">&gt; ICE BREAKER: <tspan class="status-value">READY (v9.4)</tspan></text>
  </g>

  <!-- Right Side Cyberware Emblem HUD -->
  <g transform="translate(680, 75)">
    <!-- Hexagon Frame -->
    <polygon points="40,0 80,23 80,68 40,91 0,68 0,23" fill="#0D0E17" stroke="#FCEE09" stroke-width="2" filter="url(#neon-glow-yellow)"/>
    <polygon points="40,6 74,26 74,65 40,85 6,65 6,26" fill="none" stroke="#FF0055" stroke-width="1" opacity="0.6"/>

    <!-- Neural Core Center Graphic -->
    <circle cx="40" cy="45" r="18" fill="none" stroke="#FCEE09" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="40" cy="45" r="10" fill="#FCEE09" opacity="0.8" class="blink-dot" filter="url(#neon-glow-yellow)"/>
    <path d="M 40 10 L 40 25 M 40 65 L 40 80 M 10 45 L 25 45 M 65 45 L 80 45" stroke="#00F2FE" stroke-width="1.5"/>
    
    <text x="40" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#FCEE09" letter-spacing="1">NEURAL CORE</text>
  </g>

  <!-- Animated Scanning Laser Line -->
  <line x1="0" y1="0" x2="850" y2="0" stroke="#FCEE09" stroke-width="1.5" class="scanning-bar" filter="url(#neon-glow-yellow)" opacity="0.7"/>

  <!-- Bottom Accent Flashes -->
  <rect x="35" y="222" width="60" height="3" fill="#FF0055"/>
  <rect x="100" y="222" width="120" height="3" fill="#FCEE09"/>
  <rect x="225" y="222" width="30" height="3" fill="#00F2FE"/>
</svg>
