<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050A"/>
      <stop offset="100%" stop-color="#0B0C14"/>
    </linearGradient>

    <filter id="yellow-glow-term" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="term-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#FCEE09" stroke-width="0.4" stroke-opacity="0.1"/>
    </pattern>

    <style>
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.8); }
      }

      @keyframes wave-bar {
        0%, 100% { height: 12px; }
        50% { height: 28px; }
      }

      .term-header {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        font-size: 16px;
        fill: #FCEE09;
        letter-spacing: 2px;
      }

      .module-title {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        font-size: 12px;
        fill: #00F2FE;
        letter-spacing: 1px;
      }

      .status-active {
        font-family: 'Courier New', monospace;
        font-weight: 800;
        font-size: 12px;
        fill: #FCEE09;
        letter-spacing: 1px;
      }

      .uptime-val {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        font-size: 22px;
        fill: #FF0055;
        letter-spacing: 2px;
      }

      .pulse {
        animation: pulse-dot 1.5s infinite;
      }
    </style>
  </defs>

  <!-- Panel Background -->
  <rect width="850" height="200" fill="url(#term-bg)" rx="4"/>
  <rect width="850" height="200" fill="url(#term-grid)"/>

  <!-- Border Frames -->
  <rect x="10" y="10" width="830" height="180" fill="none" stroke="#FCEE09" stroke-width="1.5" filter="url(#yellow-glow-term)"/>
  <rect x="14" y="14" width="822" height="172" fill="none" stroke="#FF0055" stroke-width="0.8" stroke-dasharray="10 5" opacity="0.6"/>

  <!-- Header Bar -->
  <rect x="25" y="22" width="220" height="26" fill="#FCEE09"/>
  <text x="35" y="40" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#05050A" letter-spacing="1">SYSTEM STATUS // DIAGNOSTICS</text>
  <line x1="250" y1="35" x2="815" y2="35" stroke="#FCEE09" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Column 1: CPU & Neural Network -->
  <g transform="translate(35, 75)">
    <!-- CPU Status -->
    <rect x="0" y="0" width="240" height="45" fill="#0D0E18" stroke="#FCEE09" stroke-width="1"/>
    <circle cx="15" cy="22" r="5" fill="#FCEE09" class="pulse"/>
    <text x="30" y="18" class="module-title">CPU PROCESSOR</text>
    <text x="30" y="34" class="status-active">&gt; ONLINE (84 CORES)</text>
    <!-- Mini progress bar -->
    <rect x="145" y="26" width="80" height="8" fill="#1A1C2B"/>
    <rect x="145" y="26" width="68" height="8" fill="#FCEE09"/>
  </g>

  <g transform="translate(35, 130)">
    <!-- Neural Network Status -->
    <rect x="0" y="0" width="240" height="45" fill="#0D0E18" stroke="#FCEE09" stroke-width="1"/>
    <circle cx="15" cy="22" r="5" fill="#00F2FE" class="pulse"/>
    <text x="30" y="18" class="module-title">NEURAL NETWORK</text>
    <text x="30" y="34" class="status-active">&gt; ACTIVE (1.2T TFLOPS)</text>
    <rect x="145" y="26" width="80" height="8" fill="#1A1C2B"/>
    <rect x="145" y="26" width="75" height="8" fill="#00F2FE"/>
  </g>

  <!-- Column 2: Machine Learning & AI Module -->
  <g transform="translate(305, 75)">
    <!-- ML Core -->
    <rect x="0" y="0" width="250" height="45" fill="#0D0E18" stroke="#FCEE09" stroke-width="1"/>
    <circle cx="15" cy="22" r="5" fill="#FCEE09" class="pulse"/>
    <text x="30" y="18" class="module-title">MACHINE LEARNING CORE</text>
    <text x="30" y="34" class="status-active">&gt; ACTIVE (PyTorch / CUDA)</text>
    <rect x="155" y="26" width="80" height="8" fill="#1A1C2B"/>
    <rect x="155" y="26" width="72" height="8" fill="#FCEE09"/>
  </g>

  <g transform="translate(305, 130)">
    <!-- AI Module -->
    <rect x="0" y="0" width="250" height="45" fill="#0D0E18" stroke="#FCEE09" stroke-width="1"/>
    <circle cx="15" cy="22" r="5" fill="#FF0055" class="pulse"/>
    <text x="30" y="18" class="module-title">AI VISION MODULE</text>
    <text x="30" y="34" class="status-active">&gt; ACTIVE (OpenCV / YOLO)</text>
    <rect x="155" y="26" width="80" height="8" fill="#1A1C2B"/>
    <rect x="155" y="26" width="78" height="8" fill="#FF0055"/>
  </g>

  <!-- Column 3: System Uptime Gauge -->
  <g transform="translate(585, 75)">
    <rect x="0" y="0" width="230" height="100" fill="#0D0E18" stroke="#FF0055" stroke-width="1.5" filter="url(#yellow-glow-term)"/>
    <rect x="0" y="0" width="230" height="20" fill="#FF0055"/>
    <text x="12" y="15" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="1">SYSTEM UPTIME GAUGES</text>

    <text x="20" y="55" font-family="'Courier New', monospace" font-size="12" fill="#FCEE09" font-weight="bold">NETRUNNER UPTIME:</text>
    <text x="20" y="85" class="uptime-val">99.99%</text>

    <!-- Wave Signal equalizer bars -->
    <g transform="translate(145, 45)">
      <rect x="0" y="15" width="6" height="25" fill="#FCEE09"/>
      <rect x="10" y="5" width="6" height="35" fill="#00F2FE"/>
      <rect x="20" y="10" width="6" height="30" fill="#FCEE09"/>
      <rect x="30" y="0" width="6" height="40" fill="#FF0055"/>
      <rect x="40" y="20" width="6" height="20" fill="#FCEE09"/>
      <rect x="50" y="8" width="6" height="32" fill="#00F2FE"/>
    </g>
  </g>
</svg>
